name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: Blender ${{ matrix.blender }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - blender: "4.2.23"   # declared minimum (LTS)
            series: "4.2"
          - blender: "5.2.1"    # current LTS
            series: "5.2"
    steps:
      - uses: actions/checkout@v4
      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender-${{ matrix.blender }}
          key: blender-${{ matrix.blender }}-linux-x64
      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL "https://download.blender.org/release/Blender${{ matrix.series }}/blender-${{ matrix.blender }}-linux-x64.tar.xz" -o blender.tar.xz
          mkdir -p ~/blender-${{ matrix.blender }}
          tar -xJf blender.tar.xz -C ~/blender-${{ matrix.blender }} --strip-components=1
      - name: Headless checks
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxrender1 libxkbcommon0 libgl1 libsm6 > /dev/null
          BLENDER=~/blender-${{ matrix.blender }}/blender ./scripts/test.sh

  build:
    name: Build extension
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender-5.2.1
          key: blender-5.2.1-linux-x64
      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL "https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz" -o blender.tar.xz
          mkdir -p ~/blender-5.2.1
          tar -xJf blender.tar.xz -C ~/blender-5.2.1 --strip-components=1
      - name: Build and validate zip
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxrender1 libxkbcommon0 libgl1 libsm6 > /dev/null
          BLENDER=~/blender-5.2.1/blender ./scripts/build.sh
      - name: No archives inside the package
        run: |
          # -Z1 lists entry names only: `unzip -l` would match the package's own path.
          if unzip -Z1 dist/*.zip | grep -iE '\.(zip|tar|gz|tgz|7z|rar)$'; then
            echo "the package contains an archive" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pascal-extension
          path: dist/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber
